<form (submit)="saveChanges()" [formGroup]="form">
    <mat-form-field appearance="outline">
        <mat-label>Title</mat-label>
        <input matInput [formControl]="form.controls.title">
        <mat-error>{{ getErrorMessagesForTitle() }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
        <mat-label>Release Date</mat-label>
        <mat-datepicker #picker></mat-datepicker>
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <input matInput [matDatepicker]="picker" [formControl]="form.controls.releaseDate">
    </mat-form-field>

    <mat-form-field appearance="outline">
        <mat-label>Trailer (YouTube URL)</mat-label>
        <input matInput [formControl]="form.controls.trailer">
    </mat-form-field>

    <app-input-img title="Movie's Poster"
    [imageUrl]="model?.poster"
    (selectedFile)="handleFileSelection($event)"></app-input-img>

    <div class="buttons-container">
        <button mat-flat-button type="submit" [disabled]="form.invalid">Save Changes</button>
        <a mat-stroked-button routerLink="/">Cancel</a>
    </div>
</form>
